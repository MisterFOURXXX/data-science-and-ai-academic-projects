[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:rag-api]
command=python -m uvicorn deployment.api:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/rag-api.err.log
stdout_logfile=/var/log/rag-api.out.log
user=root
environment=PATH="/usr/local/bin:/usr/bin:/bin"

[program:mlflow-server]
command=mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/mlflow.err.log
stdout_logfile=/var/log/mlflow.out.log