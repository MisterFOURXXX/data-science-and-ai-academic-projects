version: '3.8'

services:
  inference:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/qwen-dpo-final
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=/app/qwen-dpo-final
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root ./mlruns
  
  optuna:
    image: python:3.11
    volumes:
      - .:/app
    working_dir: /app
    command: python scripts/run_optimization.py
    depends_on:
      - mlflow